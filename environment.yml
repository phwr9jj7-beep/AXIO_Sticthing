name: axio-stitch-env
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - pyside6
  - numpy
  - scipy
  - tifffile
  - scikit-image
  - opencv
  - networkx
  - pillow
  - pytorch-cpu
  - pip
  - pip:
      - basicpy==2.0.0
      - torch-dct
      - hyperactive
      - pooch
      - "pydantic>=2.0"
      - "typer[all]>=0.9"
      - "rich>=13.0"
      - "mcp[cli]>=1.0"
      - "psutil>=5.9"
      - tqdm
      - "-e ."
