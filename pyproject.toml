[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axio-stitching"
version = "1.1.2"
description = "High-throughput spatial microscopy stitching pipeline for Zeiss Axio Tile Scans"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Ziyi Wong"}]
requires-python = ">=3.10"
keywords = ["microscopy", "stitching", "zeiss", "tiling", "imaging", "spatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "scipy",
    "tifffile",
    "scikit-image",
    "opencv-python",
    "networkx",
    "pillow",
    "tqdm",
    "pydantic>=2.0",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# The MCP SDK renamed its high-level server class in 2.0; axio_stitching.mcp_server binds
# whichever generation is installed, so either satisfies this extra.
mcp = ["mcp[cli]>=1.0"]
corrections = ["basicpy>=2.0", "torch-dct"]
gui = ["PySide6>=6.5"]
# Optional but strongly recommended: without it `axio doctor` and `axio estimate` fall back
# to per-OS system calls for memory, and cannot report available RAM on every platform.
metrics = ["psutil>=5.9"]
# Only needed on Python 3.10, which has no stdlib tomllib; the Codex config surgery uses it
# to verify what it wrote.
toml = ["tomli>=2.0; python_version < '3.11'"]
all = ["axio-stitching[mcp,corrections,gui,metrics,toml]"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "axio-stitching[all]",
]

[project.scripts]
axio = "axio_stitching.cli:main"
axio-mcp = "axio_stitching.mcp_server:main"

[project.urls]
Homepage = "https://github.com/phwr9jj7-beep/AXIO_Sticthing"
Repository = "https://github.com/phwr9jj7-beep/AXIO_Sticthing"

[tool.hatch.build.targets.wheel]
packages = ["axio_stitching"]

[tool.hatch.build.targets.sdist]
include = [
    "/axio_stitching",
    "/skills",
    "/docs",
    "/README.md",
    "/LICENSE",
]

# The agent installer renders the installed skill from the shipped source skill's
# frontmatter and copies its reference doc, so `skills/` must travel with the wheel.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "axio_stitching/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
